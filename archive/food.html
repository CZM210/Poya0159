<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流派對戰勝率計算機</title>
    <style>
        body {
            background-color: #c9a0a0;
            font-family: "Microsoft JhengHei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            /* 避免手機雙擊畫面時會放大縮小 */
            touch-action: manipulation; 
        }

        /* 提示文字 */
        .tips {
            color: #fff;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            text-align: center;
        }

        /* 上方流派選擇按鈕區 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 500px;
            width: 100%;
            margin-bottom: 20px;
        }

        .btn-genre {
            background: linear-gradient(135deg, #a5d8ff, #eebefa);
            border: none;
            border-radius: 5px;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s, transform 0.1s;
            -webkit-tap-highlight-color: transparent; /* 移除手機點擊高亮藍框 */
        }

        .btn-genre:active {
            transform: scale(0.95);
        }

        /* 被選中時的顏色（不分敵我，統一格式） */
        .btn-genre.selected {
            background: linear-gradient(135deg, #ff922b, #ff6b6b) !important;
            color: white;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        /* 中間結果顯示區 */
        .result-container {
            background-color: #d99830;
            color: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            width: 100%;
            max-width: 460px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            margin-bottom: 20px;
        }

        .vs-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .strategy-text {
            font-size: 18px;
            background: rgba(255,255,255,0.3);
            padding: 10px;
            border-radius: 5px;
            min-height: 40px;
            word-break: break-all;
        }

        /* 下方輪數選擇區 */
        .rounds-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            width: 100%;
            max-width: 500px;
            margin-bottom: 30px;
        }

        .btn-round {
            border: none;
            border-radius: 5px;
            padding: 12px 8px;
            font-size: 15px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            flex: 1;
            box-shadow: 0 3px 5px rgba(0,0,0,0.1);
        }

        .btn-round.active {
            outline: 3px solid #000;
        }
    </style>
</head>
<body>

    <div class="tips">任選兩個流派即可查看結果，點擊已選中的流派可取消</div>

    <div class="grid-container">
        <button class="btn-genre" onclick="clickGenre('刀')">刀</button>
        <button class="btn-genre" onclick="clickGenre('槍')">槍</button>
        <button class="btn-genre" onclick="clickGenre('劍')">劍</button>
        <button class="btn-genre" onclick="clickGenre('棍')">棍</button>
        <button class="btn-genre" onclick="clickGenre('內門')">內門</button>
        <button class="btn-genre" onclick="clickGenre('外門')">外門</button>
        <button class="btn-genre" onclick="clickGenre('身法')">身法</button>
        <button class="btn-genre" onclick="clickGenre('腿')">腿</button>
        <button class="btn-genre" onclick="clickGenre('拳')">拳</button>
    </div>

    <div class="rounds-container">
        <button class="btn-round" style="background-color: #8ce99a;" onclick="selectRound('1-3')">1~3輪</button>
        <button class="btn-round" style="background-color: #748ffc;" onclick="selectRound('4-6')">4~6輪</button>
        <button class="btn-round" style="background-color: #ae3ec9; color: white;" onclick="selectRound('7-9')">7~9輪</button>
        <button class="btn-round" style="background-color: #fcc419;" onclick="selectRound('10-12')">10~12輪</button>
        <button class="btn-round" style="background-color: #ff6b6b;" onclick="selectRound('13-15')">13~15輪</button>
    </div>

    <div class="result-container">
        <div class="vs-title" id="vsTitle">請選擇流派與輪數</div>
        <div class="strategy-text" id="strategyResult">請任意點選兩個流派</div>
    </div>

    <script>
        // 用陣列來儲存被選中的流派，最多只能有兩個
        let selectedGenres = []; 
        let currentRound = "1-3"; // 預設 1~3 輪

        // 初始化輪數按鈕
        document.querySelectorAll('.btn-round')[0].classList.add('active');

        // 資料庫：修改這裡的文字即可更新結果！
        const winRateData = {
            "1-3": {
                "內門-槍": "內。槍招愈多，流血多，鐵腕",
                "外門-腿": "外贏 [32] 25 vs 0",
                "身法-刀": "身法。開意高傷害刀，身法閃+血壓。"
            },
            "4-6": {
                "內門-槍": "內。槍疾風刺，爆槍",
                "外門-腿": "腿贏 [範例] 腿攻勢強"
            },
            "7-9": {
                "內門-槍": "內。內不流血+陰液痛，賭槍"
            },
            "10-12": {
                "內門-槍": "內。暴擊+大障，婚契"
            },
            "13-15": {
                "內門-槍": "內。暴擊+天陣，婚契"
            }
        };

        function clickGenre(genre) {
            const index = selectedGenres.indexOf(genre);

            if (index > -1) {
                // 1. 如果已經被選過了，再點一次就是「取消選擇」
                selectedGenres.splice(index, 1);
            } else {
                // 2. 如果沒被選過，檢查是不是已經選滿兩個了
                if (selectedGenres.length < 2) {
                    selectedGenres.push(genre);
                } else {
                    // 如果已經選了兩個，再點第三個就自動「換掉第一個選的」
                    selectedGenres.shift();
                    selectedGenres.push(genre);
                }
            }

            // 更新所有按鈕的外觀樣式
            const buttons = document.querySelectorAll('.btn-genre');
            buttons.forEach(btn => {
                if (selectedGenres.includes(btn.innerText)) {
                    btn.classList.add('selected');
                } else {
                    btn.classList.remove('selected');
                }
            });

            updateResult();
        }

        function selectRound(round) {
            currentRound = round;
            const buttons = document.querySelectorAll('.btn-round');
            buttons.forEach(btn => {
                if(btn.innerText.includes(round)) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            updateResult();
        }

        function updateResult() {
            if (selectedGenres.length < 2) {
                let currentText = selectedGenres.length === 1 ? `已選：${selectedGenres[0]}` : "無";
                document.getElementById('vsTitle').innerText = `已選擇流派 (${selectedGenres.length}/2)`;
                document.getElementById('strategyResult').innerText = `請再選擇一個流派。當前${currentText}`;
                return;
            }

            // 抓出選中的兩個流派
            const genreA = selectedGenres[0];
            const genreB = selectedGenres[1];

            document.getElementById('vsTitle').innerText = `${genreA} 與 ${genreB} (${currentRound}輪)`;

            // 雙向檢查（因為不分順序，A-B 或 B-A 都算同一組對決）
            const key1 = `${genreA}-${genreB}`;
            const key2 = `${genreB}-${genreA}`;
            
            const dataTable = winRateData[currentRound] || {};
            const resultText = dataTable[key1] || dataTable[key2] || "暫無此對決資料，可在程式碼中自行添加！";

            document.getElementById('strategyResult').innerText = resultText;
        }
    </script>
</body>
</html>

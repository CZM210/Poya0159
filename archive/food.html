<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流派對戰勝率計算機</title>
    <style>
        body {
            background-color: #c9a0a0;
            font-family: "Microsoft JhengHei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        /* 上方流派選擇按鈕區 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 500px;
            width: 100%;
            margin-bottom: 20px;
        }

        .btn-genre {
            background: linear-gradient(135deg, #a5d8ff, #eebefa);
            border: none;
            border-radius: 5px;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.1s;
        }

        .btn-genre:active {
            transform: scale(0.95);
        }

        .btn-genre.selected-left {
            background: #ff922b !important;
            color: white;
        }

        .btn-genre.selected-right {
            background: #5c7cfa !important;
            color: white;
        }

        /* 中間結果顯示區 */
        .result-container {
            background-color: #d99830;
            color: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            width: 100%;
            max-width: 460px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            margin-bottom: 20px;
        }

        .vs-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .strategy-text {
            font-size: 18px;
            background: rgba(255,255,255,0.3);
            padding: 10px;
            border-radius: 5px;
            min-height: 40px;
            word-break: break-all;
        }

        /* 下方輪數選擇區 */
        .rounds-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            width: 100%;
            max-width: 500px;
            margin-bottom: 30px;
        }

        .btn-round {
            border: none;
            border-radius: 5px;
            padding: 12px 8px;
            font-size: 15px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            flex: 1;
            box-shadow: 0 3px 5px rgba(0,0,0,0.1);
        }

        .btn-round.active {
            outline: 3px solid #000;
        }

        /* 側邊選擇提示 */
        .side-indicator {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            margin-bottom: 10px;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="side-indicator">
        <span>左鍵點擊：選擇我方</span>
        <span>右鍵點擊：選擇敵方</span>
    </div>

    <div class="grid-container">
        <button class="btn-genre" onclick="selectGenre('刀', 'left')" oncontextmenu="selectGenre('刀', 'right'); return false;">刀</button>
        <button class="btn-genre" onclick="selectGenre('槍', 'left')" oncontextmenu="selectGenre('槍', 'right'); return false;">槍</button>
        <button class="btn-genre" onclick="selectGenre('劍', 'left')" oncontextmenu="selectGenre('劍', 'right'); return false;">劍</button>
        <button class="btn-genre" onclick="selectGenre('棍', 'left')" oncontextmenu="selectGenre('棍', 'right'); return false;">棍</button>
        <button class="btn-genre" onclick="selectGenre('內門', 'left')" oncontextmenu="selectGenre('內門', 'right'); return false;">內門</button>
        <button class="btn-genre" onclick="selectGenre('外門', 'left')" oncontextmenu="selectGenre('外門', 'right'); return false;">外門</button>
        <button class="btn-genre" onclick="selectGenre('身法', 'left')" oncontextmenu="selectGenre('身法', 'right'); return false;">身法</button>
        <button class="btn-genre" onclick="selectGenre('腿', 'left')" oncontextmenu="selectGenre('腿', 'right'); return false;">腿</button>
        <button class="btn-genre" onclick="selectGenre('拳', 'left')" oncontextmenu="selectGenre('拳', 'right'); return false;">拳</button>
    </div>

    <div class="rounds-container">
        <button class="btn-round" style="background-color: #8ce99a;" onclick="selectRound('1-3')">1~3輪</button>
        <button class="btn-round" style="background-color: #748ffc;" onclick="selectRound('4-6')">4~6輪</button>
        <button class="btn-round" style="background-color: #ae3ec9; color: white;" onclick="selectRound('7-9')">7~9輪</button>
        <button class="btn-round" style="background-color: #fcc419;" onclick="selectRound('10-12')">10~12輪</button>
        <button class="btn-round" style="background-color: #ff6b6b;" onclick="selectRound('13-15')">13~15輪</button>
    </div>

    <div class="result-container">
        <div class="vs-title" id="vsTitle">請選擇流派與輪數</div>
        <div class="strategy-text" id="strategyResult">尚未選擇完整資料</div>
    </div>

    <script>
        let leftSelected = "";
        let rightSelected = "";
        let currentRound = "1-3"; // 預設 1~3 輪

        // 初始化輪數按鈕高亮
        document.querySelectorAll('.btn-round')[0].classList.add('active');

        // 資料庫：你可以在這裡補齊所有對決的文字內容！
        const winRateData = {
            "1-3": {
                "內門-槍": "內。槍招愈多，流血多，鐵腕",
                "外門-腿": "外贏 [32] 25 vs 0 (這是範例資料)",
                "身法-刀": "身法。開意高傷害刀，身法閃+血壓。"
            },
            "4-6": {
                "內門-槍": "內。槍疾風刺，爆槍",
                "外門-腿": "腿贏 [範例] 腿攻勢強"
            },
            "7-9": {
                "內門-槍": "內。內不流血+陰液痛，賭槍"
            },
            "10-12": {
                "內門-槍": "內。暴擊+大障，婚契"
            },
            "13-15": {
                "內門-槍": "內。暴擊+天陣，婚契"
            }
        };

        function selectGenre(genre, side) {
            const buttons = document.querySelectorAll('.btn-genre');
            
            if (side === 'left') {
                leftSelected = genre;
                // 更新按鈕顏色
                buttons.forEach(btn => {
                    if(btn.innerText === genre) btn.classList.add('selected-left');
                    else btn.classList.remove('selected-left');
                });
            } else {
                rightSelected = genre;
                // 更新按鈕顏色
                buttons.forEach(btn => {
                    if(btn.innerText === genre) btn.classList.add('selected-right');
                    else btn.classList.remove('selected-right');
                });
            }
            updateResult();
        }

        function selectRound(round) {
            currentRound = round;
            const buttons = document.querySelectorAll('.btn-round');
            buttons.forEach(btn => {
                if(btn.innerText.includes(round)) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            updateResult();
        }

        function updateResult() {
            if (!leftSelected || !rightSelected) {
                document.getElementById('vsTitle').innerText = `已選我方: ${leftSelected || '無'} | 敵方: ${rightSelected || '無'}`;
                document.getElementById('strategyResult').innerText = "請選齊雙方流派";
                return;
            }

            document.getElementById('vsTitle').innerText = `${leftSelected} vs ${rightSelected} (${currentRound}輪)`;

            // 組合 Key 值 (例如 "內門-槍")
            const key = `${leftSelected}-${rightSelected}`;
            const reverseKey = `${rightSelected}-${leftSelected}`; // 防呆：如果順序反過來也找找看
            
            const dataTable = winRateData[currentRound] || {};
            const resultText = dataTable[key] || dataTable[reverseKey] || "暫無此對決資料，可在程式碼中自行添加！";

            document.getElementById('strategyResult').innerText = resultText;
        }
    </script>
</body>
</html>

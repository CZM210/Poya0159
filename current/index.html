<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>全國承租展示系統 - Ver 20260806_1836</title>
    <style>
        body { background-color: #f4f7f6; font-family: "Microsoft JhengHei", Arial; font-size: 14px; margin: 0; padding: 0; }
        .container { max-width: 800px; margin: 0 auto; padding: 10px; }
        .item-card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 12px; border-left: 6px solid #ccc; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: flex-start; }
        
        .status-new { border-left-color: #007bff; background-color: #f0f7ff; }       
        .status-remove { border-left-color: #dc3545; background-color: #fff8f8; }    
        .status-pending { border-left-color: #ff8c00; background-color: #fff5e6; }   
        .status-visual { border-left-color: #28a745; background-color: #f0fff4; }    
        .status-no-img { border-left-color: #6f42c1; background-color: #f5f0ff; }    
        .status-renew { border-left-color: #17a2b8; background-color: #f0fcfd; }    

        .info-area { flex: 1; padding-right: 10px; line-height: 1.6; }
        .item-title { font-weight: bold; font-size: 1.1rem; color: #222; display: block; margin-bottom: 5px; }
        .text-removed { text-decoration: line-through; color: #aaa !important; }    
        
        .sticky-header { position: sticky; top: 0; background: #f4f7f6; padding: 10px 15px; z-index: 100; border-bottom: 1px solid #ddd; }
        .form-control { width: 100%; padding: 12px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        
        .sort-bar { display: flex; gap: 5px; margin-bottom: 8px; }
        .btn-sort { flex: 1; padding: 8px; background: #fff; border: 1px solid #ccc; border-radius: 8px; font-size: 13px; cursor: pointer; color: #555; }
        .btn-sort.active { background: #e9ecef; border-color: #007bff; color: #007bff; font-weight: bold; }

        .badge { display: inline-block; padding: 3px 8px; color: white; border-radius: 4px; font-size: 11px; margin-bottom: 5px; }
        .bg-primary { background-color: #007bff; }
        .bg-danger { background-color: #dc3545; }
        .bg-warning { background-color: #ff8c00; } 
        .bg-success { background-color: #28a745; }
        .bg-purple { background-color: #6f42c1; }
        .bg-info { background-color: #17a2b8; }
        
        .img-area { flex: 0 0 90px; text-align: right; position: relative; }
        .item-img { width: 90px; height: 90px; object-fit: contain; border: 1px solid #eee; border-radius: 8px; display: none; background: white; cursor: pointer; transition: all 0.2s; }
        
        .img-has-pdf { border: 2.5px solid #ff8c00 !important; box-shadow: 0 0 6px rgba(255, 140, 0, 0.4); }
        .pdf-hint-tag { position: absolute; bottom: 3px; right: 3px; background: #ff8c00; color: white; font-size: 10px; font-weight: bold; padding: 1px 4px; border-radius: 4px; pointer-events: none; opacity: 0.9; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.7); overflow-y: auto; }
        .modal-content { background-color: #fff; margin: 10% auto; padding: 20px; border-radius: 12px; width: 90%; max-width: 600px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .close-btn { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .close-btn:hover { color: #000; }
        .pdf-img-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 15px; }
        .pdf-img-item { width: 100%; border: 1px solid #ddd; border-radius: 6px; }
        .ver-tag { font-size: 10px; color: #888; text-align: right; padding-right: 5px; }
    </style>
</head>
<body>
<div class="sticky-header">
    <select id="f-store" class="form-control" onchange="loadStoreDetail()">
        <option value="">--- 請選擇分店 ---</option><option value="42">42 寶雅高雄五甲店</option><option value="47">47 寶雅台中學士店</option><option value="62">62 寶雅台中潭子店</option><option value="94">94 寶雅大里成功店</option><option value="158">158 寶雅台中北屯店</option><option value="159">159 寶雅文心山西店</option><option value="191">191 寶雅台中嶺東店</option><option value="212">212 寶雅台中大肚店</option><option value="358">358 寶雅太平環中一店</option><option value="464">464 寶雅台中軍功店</option><option value="42_DEL">42_DEL 寶雅高雄五甲店 (精簡部位)</option><option value="47_DEL">47_DEL 寶雅台中學士店 (精簡部位)</option><option value="62_DEL">62_DEL 寶雅台中潭子店 (精簡部位)</option><option value="94_DEL">94_DEL 寶雅大里成功店 (精簡部位)</option><option value="158_DEL">158_DEL 寶雅台中北屯店 (精簡部位)</option><option value="159_DEL">159_DEL 寶雅文心山西店 (精簡部位)</option><option value="191_DEL">191_DEL 寶雅台中嶺東店 (精簡部位)</option><option value="212_DEL">212_DEL 寶雅台中大肚店 (精簡部位)</option><option value="358_DEL">358_DEL 寶雅太平環中一店 (精簡部位)</option><option value="464_DEL">464_DEL 寶雅台中軍功店 (精簡部位)</option></select>
    <div id="filter-group" style="display:none;">
        <select id="f-dept" class="form-control" onchange="render()"></select>
        <div class="sort-bar">
            <button class="btn-sort" id="btn-sort-name" onclick="toggleSort('承租項目')">品名排序 ↕</button>
            <button class="btn-sort" id="btn-sort-status" onclick="toggleSort('比對結果')">標籤排序 ↕</button>
        </div>
        <input type="text" id="f-search" class="form-control" placeholder="搜尋品名、廠編..." onkeyup="render()">
    </div>
    <div class="ver-tag">版本: 20260806_1836</div>
</div>
<div class="container"><div id="card-container"></div></div>

<div id="pdfModal" class="modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closePdfModal()">&times;</span>
    <h3 id="modal-title" style="margin-top:0;">PDF 頁面關聯圖片</h3>
    <p id="modal-desc" style="color:#666; font-size:0.9rem;"></p>
    <div id="pdf-img-container" class="pdf-img-grid"></div>
  </div>
</div>

<script>
    var APP_VER = '20260806_1836';
    var currentData = [];
    var pdfMapping = {};
    var sortConfig = { field: '', direction: 1 };

    // 💡 獨立健全的 GAS 回報機制，確保一定會帶著分店名稱回傳
    function sendGasLog(storeFullName) {
        if (!storeFullName) return;
        var gasUrl = "https://script.google.com/macros/s/AKfycbxbdT1FnxHPyDflQgHd2jkB_SBU2MJgCTQYkeGsfVi6CX7vLxqmttM1xFuszMAa0-MyjQ/exec";
        var finalUrl = gasUrl + "?password=LOG&store=" + encodeURIComponent(storeFullName) + "&device=查看內容";
        
        try {
            fetch(finalUrl, { mode: 'no-cors' }).catch(function(e){});
        } catch(e) {}
    }

    function loadMapping() {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', './data/mapping.json?v=' + APP_VER, true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && xhr.status === 200) {
                try { 
                    pdfMapping = JSON.parse(xhr.responseText); 
                    render();
                } catch(e) { pdfMapping = {}; }
            }
        };
        xhr.send();
    }
    loadMapping();

    function loadStoreDetail() {
        var sid = document.getElementById('f-store').value;
        if (!sid) return;
        
        var storeSelect = document.getElementById('f-store');
        var storeFullName = storeSelect.options[storeSelect.selectedIndex].text;

        // 💡 一點選分店，立刻優先發送 GAS 回報，確保 D 欄絕不空白
        sendGasLog(storeFullName);

        var xhr = new XMLHttpRequest();
        xhr.open('GET', './data/' + sid + '.json?v=' + APP_VER, true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && xhr.status === 200) {
                try {
                    currentData = JSON.parse(xhr.responseText).items;
                    document.getElementById('filter-group').style.display = 'block';
                    setupFilters();
                    render();
                } catch(e) {
                    console.error("解析 JSON 失敗:", e);
                }
            }
        };
        xhr.send();
    }

    function toggleSort(field) {
        if (sortConfig.field === field) sortConfig.direction *= -1;
        else { sortConfig.field = field; sortConfig.direction = 1; }
        
        document.getElementById('btn-sort-name').classList.toggle('active', field === '承租項目');
        document.getElementById('btn-sort-status').classList.toggle('active', field === '比對結果');
        
        var arrow = sortConfig.direction === 1 ? ' ↑' : ' ↓';
        document.getElementById('btn-sort-name').innerText = '品名排序' + (field === '承租項目' ? arrow : ' ↕');
        document.getElementById('btn-sort-status').innerText = '標籤排序' + (field === '比對結果' ? arrow : ' ↕');

        currentData.sort(function(a, b) {
            var valA = (a[field] || "").toString().toLowerCase();
            var valB = (b[field] || "").toString().toLowerCase();
            if (valA < valB) return -1 * sortConfig.direction;
            if (valA > valB) return 1 * sortConfig.direction;
            return 0;
        });
        render();
    }

    function setupFilters() {
        var depts = [];
        for (var i = 0; i < currentData.length; i++) {
            var d = currentData[i]["部門"];
            if (d && depts.indexOf(d) === -1) depts.push(d);
        }
        depts.sort();
        var dH = '<option value="">-- 全部部門 (或選狀態) --</option>';
        for (var j = 0; j < depts.length; j++) dH += '<option value="' + depts[j] + '">' + depts[j] + '</option>';
        dH += '<option value="ST_NEW">⭐ 只看新增</option>';
        dH += '<option value="ST_REM">❌ 只看移除 (含待確認)</option>';
        document.getElementById('f-dept').innerHTML = dH;
    }

    function render() {
        var dVal = document.getElementById('f-dept').value;
        var qVal = document.getElementById('f-search').value.toLowerCase();
        var html = '';

        currentData.forEach(d => {
            var res = d["比對結果"] || "";
            var matchDept = (dVal==="") || 
                            (dVal==="ST_NEW" && res==="新增") || 
                            (dVal==="ST_REM" && res.indexOf("移除") !== -1) || 
                            (d["部門"]===dVal);
            
            var sT = Object.values(d).join(" ").toLowerCase();

            if (matchDept && sT.indexOf(qVal) !== -1) {
                var isVis = (res === "規格異動圖比對ｏ");
                var isNoImg = (res === "規格異動無圖比對");
                var isRenew = (res === "續租");
                var isNew = (res === "新增");
                var isPending = (res === "移除待確認");
                var isRem = (res === "移除");

                var cardCss = isVis ? "status-visual" : 
                              (isNoImg ? "status-no-img" : 
                              (isRenew ? "status-renew" : 
                              (isNew ? "status-new" : 
                              (isPending ? "status-pending" : 
                              (isRem ? "status-remove" : "" )))));

                var badgeCss = isVis ? "bg-success" : 
                               (isNoImg ? "bg-purple" : 
                               (isRenew ? "bg-info" : 
                               (isNew ? "bg-primary" : 
                               (isPending ? "bg-warning" : "bg-danger"))));

                html += '<div class="item-card ' + cardCss + '">';
                var textStyle = isRem ? "text-removed" : "";
                html += ' <div class="info-area ' + textStyle + '">';
                html += ' <span class="badge ' + badgeCss + '">' + res + '</span>';
                html += ' <span class="item-title">' + (d["承租項目"] || "未命名") + '</span>';
                
                var infoArr = ["部門: "+d["部門"], "廠商: "+d["廠商名稱"]+"("+d["廠編"]+")", "檔期: "+d["檔期"], "說明: "+d["檔期說明"]];
                
                html += ' <div style="color:#666; font-size:0.82rem;">' + infoArr.join(' | ') + '</div>';
                html += ' </div>';
                
                if (d.img_id) {
                    var imgFileName = d.img_id + ".jpg";
                    var hasPdfMatch = pdfMapping[imgFileName] && pdfMapping[imgFileName].related_images_in_page;
                    var borderClass = hasPdfMatch ? "img-has-pdf" : "";
                    var hintTagHtml = hasPdfMatch ? '<span class="pdf-hint-tag">📄 圖</span>' : '';

                    html += '<div class="img-area">';
                    html += '<img src="photos/' + imgFileName + '" class="item-img ' + borderClass + '" onclick="openPdfModal(\'' + imgFileName + '\')" onload="this.style.display=\'inline-block\'" onerror="this.style.display=\'none\'" title="點擊檢視 PDF 關聯圖">';
                    html += hintTagHtml;
                    html += '</div>';
                }
                html += '</div>';
            }
        });
        document.getElementById('card-container').innerHTML = html || '<p style="text-align:center;color:#999;padding-top:20px;">無符合資料</p>';
    }

    function openPdfModal(imgFileName) {
        var info = pdfMapping[imgFileName];
        var titleElem = document.getElementById('modal-title');
        var descElem = document.getElementById('modal-desc');
        var container = document.getElementById('pdf-img-container');

        if (info && info.related_images_in_page && info.related_images_in_page.length > 0) {
            var pdfDocName = info.pdf_doc || "PDF 文件";
            titleElem.innerText = "📄 對應 PDF 第 " + info.page + " 頁陳列圖";
            descElem.innerText = "文件：" + pdfDocName + " (相似度差距: " + info.diff_score + ")";
            
            var imgsHtml = '<a href="photos/' + imgFileName + '" target="_blank">' +
                           '<img src="photos/' + imgFileName + '" class="pdf-img-item" title="網頁卡片主圖">' +
                           '</a>';

            info.related_images_in_page.forEach(function(pdfImgName) {
                if (pdfImgName !== info.matched_pdf_img) {
                    imgsHtml += '<a href="pdf_photos/' + pdfImgName + '" target="_blank">' +
                                '<img src="pdf_photos/' + pdfImgName + '" class="pdf-img-item" title="同頁 PDF 陳列圖">' +
                                '</a>';
                }
            });
            
            container.innerHTML = imgsHtml;
        } else {
            titleElem.innerText = "⚠️ 無對應 PDF 關聯圖";
            descElem.innerText = "未在 PDF 對照表 (mapping.json) 中找到與此圖片匹配的頁面。";
            container.innerHTML = "";
        }

        document.getElementById('pdfModal').style.display = 'block';
    }

    function closePdfModal() {
        document.getElementById('pdfModal').style.display = 'none';
    }

    window.onclick = function(event) {
        var modal = document.getElementById('pdfModal');
        if (event.target == modal) {
            modal.style.display = "none";
        }
    }
</script>
</body></html>
